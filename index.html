<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker</title>
  <link rel="stylesheet" href="./style.css">
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

<nav class="navbar">
  <a href="#dashboard" class="navbar-logo">
    <img src="images/BudgetFlow_logo.svg" alt="BudgetFlow">
  </a>

    <div class="navbar-links">
    <a href="#dashboard">Dashboard</a>
    <a href="#transactions">Transactions</a>
    <a href="#reports">Reports</a>
  </div>

</nav>


<div class="container">


<main class="dashboard" id="dashboard">

 <section class="card form-section">
    <form>
    <div class="form-group">
    <label for="description">Description:</label>
    <input type="text" id="description" placeholder="Enter a description">
  </div>

  <div class="form-group">
    <label for="amount">Amount:</label>
    <input type="number" id="amount" placeholder="0.00">
  </div>

  <div class="form-group">
    <label for="category">Category:</label> 
    <select id="category" required>
      <option value="" disabled selected hidden>Select a category</option>
      <option value="income">Income</option>
      <option value="living_expenses">Living Expenses</option>
      <option value="transportation">Transportation expenses</option>
      <option value="personal_care">Personal care</option>
      <option value="healthcare">Healthcare</option>
      <option value="technology">Technology</option>
      <option value="debt_payments">Debt payments</option>
      <option value="savings_investments">Savings and investments</option>
      <option value="entertainment">Entertainment</option>
      <option value="miscellaneous">Miscellaneous expenses</option>
    </select>
  </div>

  <div class="form-buttons">
    <button type="button" id="add-transaction">Add Transaction</button>
    <button type="button" id="cancel-edit">Cancel</button>
  </div>
  </form>
</section> 

<section class="dashboard-summary">

  <div class="card balance-card">
    <span>Current Balance</span>
    <p id="current-balance">$ 0.00</p>
  </div>

  <div class="card summary-income-expenses">

  <div class="summary-item">

    <div class="summary-icon">
      <i class="bi bi-graph-up-arrow"></i>
    </div>

    <div class="summary-info">
      <span>Income</span>
      <p id="total-income">$0.00</p>
    </div>

    <span class="summary-change">+12.5%</span>

  </div>

  <div class="summary-item">

    <div class="summary-icon">
      <i class="bi bi-graph-down-arrow"></i>
    </div>

    <div class="summary-info">
      <span>Expenses</span>
      <p id="total-expenses">$0.00</p>
    </div>

    <span class="summary-change">-8.2%</span>

  </div>

</div>

</section>

<section class="card transactions-section">
  <div class="transaction-list">
    <h2>Transactions</h2>

  <div class="filter-section">

    <div class="search-box">
      <i class="bi bi-search"></i>
      <input
    type="text"
    id="search-transactions"
    placeholder="Search transactions..."
    >
    </div>

    <select id="category-filter">
    <option value="all">All Categories</option>
    <option value="income">Income</option>
    <option value="living_expenses">Living Expenses</option>
    <option value="transportation">Transportation</option>
    <option value="personal_care">Personal Care</option>
    <option value="healthcare">Healthcare</option>
    <option value="technology">Technology</option>
    <option value="debt_payments">Debt Payments</option>
    <option value="savings_investments">Savings & Investments</option>
    <option value="entertainment">Entertainment</option>
    <option value="miscellaneous">Miscellaneous</option>
</select>

    <select id="sort-filter">
    <option value="">Sort</option>
    <option value="newest">Newest</option>
    <option value="oldest">Oldest</option>
    <option value="highest">Highest Amount</option>
    <option value="lowest">Lowest Amount</option>
</select>

</div>

    <ul id="transactions"></ul>
  </div>

<div class="delete-modal">
  <div class="delete-modal-content">

    <h3>
      <i class="bi bi-trash3"></i>
      Delete transaction?
    </h3>

    <p id="delete-message">Are you sure you want to delete this transaction?</p>

    <div class="delete-modal-actions">
      <button>Cancel</button>
      <button>Delete</button>      
    </div>

  </div>
</div>
</section>

</main>
</div>


<script src="script.js"></script>
</body>
</html>
